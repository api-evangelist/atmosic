name: Atmosic
description: >-
  Atmosic Technologies is a fabless semiconductor company headquartered in San Jose,
  California that designs ultra-low-power wireless system-on-chips for the Internet of
  Things, with the stated goal of radically reducing — and in some deployments eliminating —
  device dependence on batteries. Its ATM2, ATM3, ATM33/e and ATM34/e families combine
  Bluetooth LE (plus 802.15.4 for Thread, Matter and Zigbee on the ATM34/e) radios with an
  Arm Cortex-M33F application processor, Arm TrustZone, cryptographic accelerators, and
  patented energy-harvesting and controlled wake-up receiver technology. Design wins include
  Samsung's SmartTag2 and Google Android TV remote controls. Atmosic ships an EMBEDDED
  developer surface rather than a public web API: the open-source OpenAir SDK built on the
  Zephyr RTOS and distributed from the Atmosic GitHub organization as a west manifest, a
  published AT command set for host control of BLE peripheral, central and GATT roles, an
  atm_isp protobuf schema describing the in-system-programming archive format, desktop
  programming and RF utilities, DevTools mobile apps, evaluation kits, and an NDA-gated
  customer portal for the commercial SDK and datasheets.

notes: >-
  No /.well-known/ discovery surface is published on any Atmosic host. Atmosic ships an
  embedded developer surface — the OpenAir Zephyr SDK, an AT command set over UART, an
  atm_isp protobuf schema, desktop programming utilities and evaluation kits — rather
  than a public web API, so no OAuth/OIDC discovery documents, security.txt, API catalog,
  agent card or llms.txt are present. Probes were run with a browser User-Agent because
  atmosic.com returns 403 to default bot agents; all results above are genuine 404s from
  the origin, not bot blocks.
pointer_note: >-

source: https://atmosic.com/public/OpenAir_SDK_doc/openair/subsys/at_cmd_set/README_errors.html
format: at-command
format_note: >-
  Not RFC 9457 — Atmosic ships no HTTP API. Errors are returned by the OpenAir AT command
  set over UART. Generic framework errors are returned as ERR:<code> where <code> is the
  decimal value of at_cmd_err_t (1-7). Command-specific errors are returned as
  +<CMD>:<hex_app_err> on one line followed by ERR on the next, where <hex_app_err> is an
  at_cmd_app_err_t value. Successful commands respond OK.
envelope:
  success: OK
  generic_error: 'ERR:<decimal at_cmd_err_t>'
  specific_error: "+<CMD>:<hex at_cmd_app_err_t>\\nERR"
families:
- name: at_cmd_err_t
  description: AT command framework errors
  radix: decimal
  codes:
  - {code: 0, constant: AT_CMD_ERR_NO_ERROR, meaning: No error; command executed successfully (OK response)}
  - {code: 1, constant: AT_CMD_ERR_NOT_SUPPORT, meaning: Command not supported — Kconfig symbol disabled or operation not implemented}
  - {code: 2, constant: AT_CMD_ERR_WRONG_ARGU_CNT, meaning: Wrong number of arguments supplied}
  - {code: 3, constant: AT_CMD_ERR_WRONG_ARGU_RANGE, meaning: One or more argument values are outside the permitted range}
  - {code: 4, constant: AT_CMD_ERR_WRONG_ARGU_TYPE, meaning: An argument has an unexpected type}
  - {code: 5, constant: AT_CMD_ERR_WRONG_ARGU_TYPE_OR_RANGE, meaning: An argument has the wrong type or is out of range}
  - {code: 6, constant: AT_CMD_ERR_WRONG_ARGU_CONTENT, meaning: Argument content is syntactically valid but semantically rejected}
  - {code: 7, constant: AT_CMD_ERR_WRONG_EXECUTE_TYPE, meaning: The command form used (test / query / execute) is not supported}
  - {code: '0x80', constant: AT_CMD_ERR_SPECIFIC_ERR, meaning: Command-specific error; the +<CMD>:<hex_app_err> prefix carries the at_cmd_app_err_t value}
